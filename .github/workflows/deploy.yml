name: Deploy to IONOS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  # Wird von publish-blog.yml aufgerufen, weil Pushes mit GITHUB_TOKEN
  # keinen push-Trigger ausloesen und neue Artikel sonst nie live gingen.
  workflow_call:
    inputs:
      ref:
        description: Commit, der deployt werden soll (leer = ausloesender Commit)
        type: string
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ionos
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP to IONOS
        env:
          SFTP_HOST: ${{ secrets.IONOS_FTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_FTP_USER }}
          SFTP_PASS: ${{ secrets.IONOS_FTP_PASS }}
          SFTP_DIR: ${{ secrets.IONOS_FTP_DIR }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 120;
            open sftp://$SFTP_USER:$SFTP_PASS@$SFTP_HOST;
            put -O / .htaccess;
            put -O / robots.txt;
            put -O $SFTP_DIR robots.txt;
            put -O $SFTP_DIR llms.txt;
            put -O / sitemap.xml;
            put -O $SFTP_DIR sitemap.xml;
            put -O $SFTP_DIR index.html;
            put -O $SFTP_DIR impressum.html;
            put -O $SFTP_DIR datenschutz.html;
            put -O $SFTP_DIR agb.html;
            put -O $SFTP_DIR widerruf.html;
            put -O $SFTP_DIR fonts.css;
            put -O $SFTP_DIR maps-consent.js;
            put -O $SFTP_DIR standorte.html;
            put -O $SFTP_DIR 7a7c3578bc2fb01274f59ee760f00e2a.txt;
            put -O $SFTP_DIR preise.html;
            put -O $SFTP_DIR vorher-nachher.html;
            put -O $SFTP_DIR rechner.html;
            put -O $SFTP_DIR fragen.html;
            put -O $SFTP_DIR preisspiegel.html;
            put -O $SFTP_DIR team.html;
            put -O $SFTP_DIR 404.html;
            put -O $SFTP_DIR bueroreinigung-koeln.html;
            put -O $SFTP_DIR broschuere.html;
            put -O $SFTP_DIR angebot.html;
            put -O $SFTP_DIR CleanConnect_Broschuere.pdf;
            put -O $SFTP_DIR favicon.ico;
            put -O $SFTP_DIR favicon-16x16.png;
            put -O $SFTP_DIR favicon-32x32.png;
            put -O $SFTP_DIR favicon-48x48.png;
            put -O $SFTP_DIR apple-touch-icon.png;
            put -O $SFTP_DIR logo.png;
            put -O $SFTP_DIR og-image.jpg;
            mirror -R --parallel=5 fonts $SFTP_DIR/fonts;
            mirror -R --parallel=5 images $SFTP_DIR/images;
            mirror -R --parallel=5 standorte $SFTP_DIR/standorte;
            mirror -R --parallel=5 blog $SFTP_DIR/blog;
            rm -f $SFTP_DIR/images/img-002.jpg $SFTP_DIR/images/img-002.webp $SFTP_DIR/images/julian-muehlhoff.jpg;
            # Alte Bildnamen (seit 09./10.11. per 301 auf sprechende Namen) physisch entfernen
            rm -f $SFTP_DIR/images/img_01.webp $SFTP_DIR/images/img_01.jpg $SFTP_DIR/images/img_01-560.webp $SFTP_DIR/images/img_01-560.jpg $SFTP_DIR/images/img_03.webp $SFTP_DIR/images/img_03.jpg;
            rm -f $SFTP_DIR/images/img_03-560.webp $SFTP_DIR/images/img_03-560.jpg $SFTP_DIR/images/img_04.webp $SFTP_DIR/images/img_04.jpg $SFTP_DIR/images/img_04-560.webp $SFTP_DIR/images/img_04-560.jpg;
            rm -f $SFTP_DIR/images/img_05.webp $SFTP_DIR/images/img_05.jpg $SFTP_DIR/images/img_05-560.webp $SFTP_DIR/images/img_05-560.jpg $SFTP_DIR/images/img_06.webp $SFTP_DIR/images/img_06.jpg;
            rm -f $SFTP_DIR/images/img_06-560.webp $SFTP_DIR/images/img_06-560.jpg $SFTP_DIR/images/img_07.webp $SFTP_DIR/images/img_07.jpg $SFTP_DIR/images/img_07-560.webp $SFTP_DIR/images/img_07-560.jpg;
            rm -f $SFTP_DIR/images/img_08.webp $SFTP_DIR/images/img_08.jpg $SFTP_DIR/images/img_08-560.webp $SFTP_DIR/images/img_08-560.jpg $SFTP_DIR/images/img_10.webp $SFTP_DIR/images/img_10.jpg;
            rm -f $SFTP_DIR/images/img_10-560.webp $SFTP_DIR/images/img_10-560.jpg $SFTP_DIR/images/img_12.webp $SFTP_DIR/images/img_12.jpg $SFTP_DIR/images/img_12-560.webp $SFTP_DIR/images/img_12-560.jpg;
            rm -f $SFTP_DIR/images/img_13.webp $SFTP_DIR/images/img_13.jpg $SFTP_DIR/images/img_13-560.webp $SFTP_DIR/images/img_13-560.jpg $SFTP_DIR/images/img_14.webp $SFTP_DIR/images/img_14.jpg;
            rm -f $SFTP_DIR/images/img_14-560.webp $SFTP_DIR/images/img_14-560.jpg $SFTP_DIR/images/img-003.webp $SFTP_DIR/images/img-003.jpg $SFTP_DIR/images/img-003-560.webp $SFTP_DIR/images/img-003-560.jpg;
            rm -f $SFTP_DIR/images/img-004.webp $SFTP_DIR/images/img-004.jpg $SFTP_DIR/images/img-004-560.webp $SFTP_DIR/images/img-004-560.jpg $SFTP_DIR/images/logo-96.webp $SFTP_DIR/images/logo-96.jpg;
            rm -f $SFTP_DIR/images/logo-96-560.webp $SFTP_DIR/images/logo-96-560.jpg $SFTP_DIR/images/praxis/bauend-atrium-vorher.webp $SFTP_DIR/images/praxis/bauend-atrium-nachher.webp $SFTP_DIR/images/praxis/bauend-bueroflaeche-vorher.webp $SFTP_DIR/images/praxis/bauend-bueroflaeche-nachher.webp;
            rm -f $SFTP_DIR/images/praxis/bauend-teppich-tuer-vorher.webp $SFTP_DIR/images/praxis/bauend-teppich-tuer-nachher.webp $SFTP_DIR/images/praxis/bauend-treppe-vorher.webp $SFTP_DIR/images/praxis/bauend-treppe-nachher.webp $SFTP_DIR/images/praxis/cafe-boden-vorher.webp $SFTP_DIR/images/praxis/cafe-boden-maschine.webp;
            rm -f $SFTP_DIR/images/praxis/cafe-boden-nasssauger.webp $SFTP_DIR/images/praxis/fassade-klinker-vorher.webp $SFTP_DIR/images/praxis/fassade-klinker-nachher.webp $SFTP_DIR/images/praxis/fenster-vorher.webp $SFTP_DIR/images/praxis/fenster-nachher.webp $SFTP_DIR/images/praxis/glasdach-vorher.webp;
            rm -f $SFTP_DIR/images/praxis/glasdach-nachher.webp $SFTP_DIR/images/praxis/kueche-fliesenboden-vorher.webp $SFTP_DIR/images/praxis/kueche-fliesenboden-nachher.webp $SFTP_DIR/images/praxis/sanitaer-wc-vorher.webp $SFTP_DIR/images/praxis/sanitaer-wc-nachher.webp $SFTP_DIR/images/praxis/teekueche-spuele-vorher.webp;
            rm -f $SFTP_DIR/images/praxis/teekueche-spuele-nachher.webp;
            rm -f $SFTP_DIR/images/img_00.png $SFTP_DIR/images/img_02.jpg $SFTP_DIR/images/img_02.webp $SFTP_DIR/images/img_09.jpg $SFTP_DIR/images/img_09.webp $SFTP_DIR/images/img_11.jpg $SFTP_DIR/images/img_11.webp $SFTP_DIR/images/img_15.png $SFTP_DIR/images/img-001.webp;
          "
